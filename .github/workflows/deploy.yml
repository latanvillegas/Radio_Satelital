name: Deploy Next.js to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy build artifacts to main
        run: |
          # Ensure static build files are in root for main branch
          rm -rf _next docs
          cp -r out/_next .
          cp out/index.html .
          cp -r out/docs .
          cp out/404.html . 2>/dev/null || true
          cp out/sitemap.xml . 2>/dev/null || true
          cp out/robots.txt . 2>/dev/null || true
          echo "latanvillegas.online" > CNAME
          touch .nojekyll

      - name: Commit build to main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html _next/ docs/ CNAME .nojekyll 404.html sitemap.xml robots.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update main branch with latest build and docs redirect" && git push origin main)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
