name: Dependency security audit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1'
permissions:
  contents: read
jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Verify committed lock without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit all dependencies (fail on high or critical)
        run: npm audit --audit-level=high --json > npm-audit.json
      - name: Summarize audit findings
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          if (!fs.existsSync('npm-audit.json')) {
            console.error('Audit JSON was not generated')
            process.exit(1)
          }
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'))
          if (report.error) {
            console.error('Audit execution error:', report.error.code, report.error.summary)
            process.exit(1)
          }
          console.log('Severity totals:', JSON.stringify(report.metadata?.vulnerabilities ?? {}))
          for (const [name, v] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(JSON.stringify({ name, severity: v.severity, range: v.range, isDirect: v.isDirect,
              fixAvailable: v.fixAvailable, via: v.via.map(x => typeof x === 'string' ? x : { title: x.title, url: x.url, severity: x.severity, range: x.range }) }))
          }
          NODE
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-dependency-audit
          path: |
            npm-audit.json
            package-lock.json
          if-no-files-found: warn
          retention-days: 14
