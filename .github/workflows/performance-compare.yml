name: Performance comparison — original vs Broadcast
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Build candidate from committed lock
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Checkout original baseline
        uses: actions/checkout@v4
        with:
          ref: 8a58fbc4591827a5f6257e96e6086cfafb251479
          path: baseline
          persist-credentials: false
      - name: Build original (no historical npm lock)
        working-directory: baseline
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run paired browser benchmark
        run: node scripts/compare-browser-performance.mjs baseline/out out
      - name: Upload paired evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-comparison
          path: |
            benchmark-results/
            baseline/package-lock.json
          if-no-files-found: warn
          retention-days: 14
