name: Stream Health Audit

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-streams:
    name: Verify Radio Streams Availability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run concurrent stream health check
        run: node scripts/check-streams.mjs --concurrency=14 --timeout=4500 --output=stream-health-report.json

      - name: Upload stream health JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stream-health-report
          path: stream-health-report.json
          retention-days: 30
