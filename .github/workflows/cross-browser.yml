name: Browser compatibility — Firefox, WebKit and mobile
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firefox-desktop
            engine: firefox
          - project: webkit-desktop
            engine: webkit
          - project: android-emulation
            engine: chromium
          - project: ios-emulation
            engine: webkit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Compatibility scenarios
        run: npx playwright test --config=playwright.cross.config.mjs --project=${{ matrix.project }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.project }}
          path: |
            playwright-report-cross/
            test-results-cross/
          if-no-files-found: warn
          retention-days: 14
