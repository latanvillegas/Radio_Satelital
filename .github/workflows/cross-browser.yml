name: Browser compatibility — Firefox, WebKit and mobile
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: firefox-desktop
            engine: firefox
          - project: webkit-desktop
            engine: webkit
          - project: android-emulation
            engine: chromium
          - project: ios-emulation
            engine: webkit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Configure Firefox audio output on headless Linux
        if: matrix.engine == 'firefox'
        run: |
          if ! command -v pulseaudio >/dev/null || ! command -v pactl >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y pulseaudio pulseaudio-utils
          fi
          if ! pactl info >/dev/null 2>&1; then
            pulseaudio --start --exit-idle-time=-1
          fi
          pactl load-module module-null-sink sink_name=broadcast_ci rate=44100 channels=2
          pactl set-default-sink broadcast_ci
          pactl info
          pactl list short sinks
      - name: Compatibility scenarios
        run: npx playwright test --config=playwright.cross.config.mjs --project=${{ matrix.project }}
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.project }}
          path: |
            playwright-report-cross/
            test-results-cross/
          if-no-files-found: warn
          retention-days: 14
